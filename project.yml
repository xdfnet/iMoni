name: iMoni
options:
  bundleIdPrefix: David
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K9UF7A2D7Y
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    COMBINE_HIDPI_IMAGES: YES
    CURRENT_PROJECT_VERSION: 1

targets:
  iMoni:
    type: application
    platform: macOS
    sources:
      - path: iMoni
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: David.iMoni
        CODE_SIGN_ENTITLEMENTS: iMoni/iMoni.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTING_SEARCH_PATHS: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.28.9"
    dependencies: []

  iMoniTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: iMoniTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: David.iMoniTests
        PRODUCT_NAME: iMoniTests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K9UF7A2D7Y
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iMoni

schemes:
  iMoni:
    build:
      targets:
        iMoni: all
        iMoniTests: test
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - iMoniTests
